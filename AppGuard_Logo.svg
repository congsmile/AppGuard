  <!-- AppGuard Text (Obsidian Black) -->
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="42" font-weight="bold" fill="#090d16" text-anchor="middle" letter-spacing="1">AppGuard</text>
